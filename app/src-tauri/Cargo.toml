[package]
name = "baud"
version = "0.1.0"
description = "BAUD - the AIPass desktop fleet monitor"
authors = ["AIPass"]
edition = "2021"
rust-version = "1.77.2"

# Tauri 2 convention: the app logic lives in a library so that the desktop
# binary and the (future) mobile entry points share one implementation.
[lib]
name = "baud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
