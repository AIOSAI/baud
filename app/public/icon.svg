  <circle cx="256" cy="176" r="46" fill="#4ade80"/>
  <rect x="118" y="286" width="276" height="18" rx="9" fill="#4ade80"/>
  <rect x="118" y="336" width="196" height="18" rx="9" fill="#2b3a35"/>
  <rect x="118" y="386" width="236" height="18" rx="9" fill="#2b3a35"/>
</svg>
