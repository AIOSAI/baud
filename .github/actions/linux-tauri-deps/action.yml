name: Linux Tauri build dependencies
description: >
  Tauri v2's documented Ubuntu prerequisites, in one place so the CI lane and
  the release cut cannot drift apart. Both workflows pin ubuntu-24.04, because
  these package names — libwebkit2gtk-4.1-dev above all — are exactly what a
  silent runner-image roll would break.

inputs:
  extra-packages:
    description: >
      Space-separated extra apt packages. Both callers pass `tmux` today: CI
      for the live rooms tests, and the release lane because it runs that same
      suite as a gate before it ships a binary. A build that only compiles
      would need none.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev \
          libssl-dev \
          build-essential \
          pkg-config \
          curl \
          wget \
          file \
          ${{ inputs.extra-packages }}
