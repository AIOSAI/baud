name: Release

# Releases are routine, not ceremony (Patrick's ruling, 2026-08-12): AIPass
# bumps constantly and BAUD ships packaged with it, so the cut must be a robot's
# job from day one. The only human step, forever, is `drone @git tag vX.Y.Z` —
# everything below happens because that tag landed.
#
# What gets attached is the real shipping binary, not a lookalike: `npm run
# tauri build` is the same command the README documents as the deploy, and
# `bundle.active` is false in tauri.conf.json, so it produces
# app/src-tauri/target/release/baud rather than installers.
#
# Each release also carries the built phone bundle, baud-phone-<tag>.tar.gz,
# with its sha256 in the same SHA256SUMS.txt. The AIPass installer will fetch
# the phone face from BAUD's latest release, so the release is what it installs.
#
# And each carries baud-cli-<tag>-linux-x86_64, the headless binary: the same
# crate built with the gui feature off - the six headless verbs, no window, no
# GTK linked - for the host API on a machine with no desktop (FPLAN-0589). Its
# sha256 joins the same SHA256SUMS.txt.
#
# And each carries install.sh, the front door a stranger runs (FPLAN-0642),
# stamped with this tag and the AIPass version in AIPASS_VERSION; its sha256
# is the last line of the same SHA256SUMS.txt.
on:
  push:
    tags: ["v*"]

# Creating the release and uploading its assets is the only write this repo's
# automation does.
permissions:
  contents: write

# Never cancel a release mid-flight — a half-published tag is worse than a slow
# one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # tmux is requested here too, unlike a plain build, because this job runs
      # the test suite before it ships anything — see the gate below.
      - uses: ./.github/actions/linux-tauri-deps
        with:
          extra-packages: tmux

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          # A separate key from ci.yml: this job fills target/ with a release
          # profile (lto, one codegen unit) that the debug lane never builds.
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - run: npm ci
        working-directory: app

      # The gate: never ship a binary that has not passed its own suite. A tag
      # is normally cut from a commit CI already proved green on main, but a tag
      # can be pointed anywhere, and "it was probably green" is not evidence.
      # This costs runner minutes, not human steps — the ruling was about
      # ceremony, and there is none here. Drop this step if a release ever needs
      # to be faster than it needs to be honest.
      - run: cargo test --locked
        working-directory: app/src-tauri

      # `beforeBuildCommand` runs `npm run build` (tsc && vite build) first, so
      # this single command covers the frontend type check and bundle as well.
      - run: npm run tauri build
        working-directory: app

      # baud-cli, in its own cargo invocation after the app rather than folded into
      # it: built together, feature unification would switch gui back on and compile
      # tauri into the one binary that must not carry it.
      - run: cargo build --release --locked --no-default-features --bin baud-cli
        working-directory: app/src-tauri

      # The phone face (vite.config.phone.ts). Built BEFORE the binary is staged:
      # the bundle stamps `git status` into itself, and the staged binaries and
      # SHA256SUMS.txt are untracked files at the checkout root, so a build after
      # them would stamp a clean tag as "+3 dirty".
      - run: npm run build:phone
        working-directory: app

      # Name the asset after the tag: a bare `baud` file downloaded from three
      # different releases is three indistinguishable files on disk.
      - name: Stage the binary
        run: |
          binary=app/src-tauri/target/release/baud
          test -x "$binary"
          cp "$binary" "baud-${GITHUB_REF_NAME}-linux-x86_64"
          ls -lh "baud-${GITHUB_REF_NAME}-linux-x86_64"
          sha256sum "baud-${GITHUB_REF_NAME}-linux-x86_64" | tee SHA256SUMS.txt

      # The headless binary, named the same way. ci.yml's ldd check runs again here
      # because a tag can point at a commit CI never saw, and a baud-cli that links
      # GTK is the one thing this asset must never be.
      - name: Stage the headless binary
        run: |
          binary=app/src-tauri/target/release/baud-cli
          test -x "$binary"
          linked=$(ldd "$binary")
          echo "$linked"
          if echo "$linked" | grep -Ei 'libgtk|libwebkit|libjavascriptcore|libsoup'; then
            echo "baud-cli links a GUI library - the gui feature gate leaked"
            exit 1
          fi
          cp "$binary" "baud-cli-${GITHUB_REF_NAME}-linux-x86_64"
          ls -lh "baud-cli-${GITHUB_REF_NAME}-linux-x86_64"
          sha256sum "baud-cli-${GITHUB_REF_NAME}-linux-x86_64" | tee -a SHA256SUMS.txt

      # Pack exactly what @api's face.py serves: phone.html and the other files at
      # the top of dist-phone, plus the assets/ mount. No other directory there is
      # servable, so a stray one fails the release instead of shipping. tar runs
      # from inside dist-phone, so the archive root is the bundle itself.
      - name: Pack the phone bundle
        run: |
          archive="baud-phone-${GITHUB_REF_NAME}.tar.gz"
          test -f app/dist-phone/phone.html
          test -d app/dist-phone/assets
          stray=$(find app/dist-phone -mindepth 1 -maxdepth 1 -type d ! -name assets)
          if [ -n "$stray" ]; then echo "not servable by face.py: $stray"; exit 1; fi
          tar -C app/dist-phone --sort=name --owner=0 --group=0 --numeric-owner -czf "$archive" .
          tar -tzvf "$archive"
          sha256sum "$archive" | tee -a SHA256SUMS.txt

      # The front door (FPLAN-0642). install.sh in the repo carries two placeholders
      # and refuses to run unstamped; the release stamps its own tag and the AIPass
      # version this tag ships with (AIPASS_VERSION at the root, bumped by the
      # release playbook), so a script fetched from a release installs that pair
      # and no other. The pin is checked against PyPI here: a version PyPI does
      # not publish fails the release, not a stranger's install.
      - name: Stamp the installer
        run: |
          aipass_version=$(tr -d ' \n' < AIPASS_VERSION)
          case "$aipass_version" in
            ''|*[!0-9.]*) echo "AIPASS_VERSION is not a bare version: '$aipass_version'"; exit 1 ;;
          esac
          curl -fsS -o /dev/null "https://pypi.org/pypi/aipass/${aipass_version}/json" \
            || { echo "aipass ${aipass_version} is not published on PyPI"; exit 1; }
          grep -qx 'BAUD_TAG="@BAUD_TAG@"' install.sh
          grep -qx 'AIPASS_VERSION="@AIPASS_VERSION@"' install.sh
          mkdir -p stage
          sed -e "s/^BAUD_TAG=\"@BAUD_TAG@\"\$/BAUD_TAG=\"${GITHUB_REF_NAME}\"/" \
              -e "s/^AIPASS_VERSION=\"@AIPASS_VERSION@\"\$/AIPASS_VERSION=\"${aipass_version}\"/" \
              install.sh > stage/install.sh
          if grep -q '@BAUD_TAG@\|@AIPASS_VERSION@' stage/install.sh; then
            echo "a placeholder survived the stamp"; exit 1
          fi
          sh -n stage/install.sh
          shellcheck -s sh stage/install.sh
          grep -n '^BAUD_TAG=\|^AIPASS_VERSION=' stage/install.sh
          (cd stage && sha256sum install.sh) | tee -a SHA256SUMS.txt

      # `gh` is preinstalled on the runner, so the publish step needs no
      # third-party action and no token beyond the one this workflow was given.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "baud-${GITHUB_REF_NAME}-linux-x86_64" \
            "baud-cli-${GITHUB_REF_NAME}-linux-x86_64" \
            "baud-phone-${GITHUB_REF_NAME}.tar.gz" \
            stage/install.sh \
            SHA256SUMS.txt
